---
layout: default
---

<style>
  /* 불필요한 기본 테마 햄버거 아이콘 강제 숨김 처리 */
  .sidebar-toggle-wrapper {
    display: none !important;
  }

/* ===== 홈 페이지 스타일 ===== */
.home-wrap {
  max-width: 1100px;
  margin: 0 auto;
  padding: 0 1.5rem 6rem;
  text-align: left !important;
}

.hero {
  text-align: center;
  padding: 4.5rem 1rem;
}
.hero h1 {
  font-size: 3rem;
  font-weight: 700;
  margin: 0 0 1rem;
  letter-spacing: -0.02em;
}
.hero p {
  font-size: 1rem;
  color: #666;
  margin: 0 0 1.4rem;
  line-height: 1.7;
}

.hero-meta {
  display: inline-flex;
  align-items: center;
  gap: 0.6rem;
  font-size: 0.82rem;
  color: #9a9aa8;
}
.hero-meta strong {
  color: #4a3aff;
  font-weight: 600;
}
.hero-meta .sep { color: #e0e0e8; }

.home-divider {
  height: 1px;
  background: #f0f0f4;
  margin: 3.5rem 0 3rem;
  border: 0;
}

@media (max-width: 600px) {
  .hero { padding: 3rem 1rem; }
  .hero h1 { font-size: 2.2rem; }
  .home-divider { margin: 2.8rem 0 2.4rem; }
}
</style>

<div class="hero">
  <h1>{{ page.title }}</h1>
  <p>{{ content }}</p>

  {% if site.blog_start %}
  <div class="hero-meta">
    <span><strong id="dayCount">–</strong>일째</span>
    <span class="sep">·</span>
    <span>글 <strong>{{ site.posts.size }}</strong>편</span>
  </div>
  {% endif %}
</div>

<div class="home-wrap">
    {% include timeline.html limit=3 direction="horizontal" more=true %}

  <hr class="home-divider">
  {% include calendar.html %}
</div>

{% if site.blog_start %}
<script>
(function () {
  var el = document.getElementById('dayCount');
  if (!el) return;
  var start = new Date("{{ site.blog_start | date: '%Y-%m-%d' }}T00:00:00");
  var today = new Date();
  today.setHours(0, 0, 0, 0);
  var days = Math.floor((today - start) / 86400000) + 1;
  el.textContent = days > 0 ? days : 1;
})();
</script>
{% endif %}
