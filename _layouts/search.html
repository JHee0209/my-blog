---
layout: default
---

<div class="search-container">
  <div class="search-header">
    <h1>검색</h1>
    <div class="search-input-wrapper">
      <input type="text" id="searchInput" placeholder="검색어를 입력하세요..." autocomplete="off">
    </div>
  </div>

  <!-- 수정된 태그 나열 영역 (상단 8개 제한 및 More 버튼) -->
  <div class="search-tags-section">
    <div class="tags-header">
      <span class="tags-title">태그 목록</span>
      <a href="{{ '/tags/' | relative_url }}" class="more-link">More +</a>
    </div>
    <div class="tags-wrapper">
      {% assign popular_tags = site.tags | sort %}
      {% for tag in popular_tags limit: 8 %}
        <a href="{{ '/tags/#' | append: tag[0] | relative_url }}" class="search-tag-item">
          #{{ tag[0] }}
        </a>
      {% endfor %}
    </div>
  </div>

  <!-- 검색 결과 목록 -->
  <div class="search-results" id="searchResults"></div>
</div>

<script>
document.addEventListener("DOMContentLoaded", function() {
  const searchInput = document.getElementById("searchInput");
  const searchResults = document.getElementById("searchResults");

  const posts = [
    {% for post in site.posts %}
      {
        "title": {{ post.title | jsonify }},
        "url": {{ post.url | relative_url | jsonify }},
        "date": {{ post.date | date: "%Y-%m-%d" | jsonify }},
        "excerpt": {{ post.excerpt | strip_html | truncate: 120 | jsonify }},
        "tags": {{ post.tags | join: ", " | jsonify }}
      }{% unless forloop.last %},{% endunless %}
    {% endfor %}
  ];

  searchInput.addEventListener("input", function() {
    const query = this.value.trim().toLowerCase();
    searchResults.innerHTML = "";

    if (query.length === 0) return;

    const filtered = posts.filter(post => 
      post.title.toLowerCase().includes(query) ||
      post.excerpt.toLowerCase().includes(query) ||
      post.tags.toLowerCase().includes(query)
    );

    if (filtered.length === 0) {
      searchResults.innerHTML = `<p class="no-results">"${query}"에 대한 검색 결과가 없습니다.</p>`;
      return;
    }

    filtered.forEach(post => {
      const item = document.createElement("div");
      item.className = "search-result-item";
      item.innerHTML = `
        <span class="result-date">${post.date}</span>
        <h3 class="result-title"><a href="${post.url}">${post.title}</a></h3>
        <p class="result-excerpt">${post.excerpt}</p>
      `;
      searchResults.appendChild(item);
    });
  });
});
</script>

<style>
.search-container {
  max-width: 700px;
  margin: 0 auto;
  padding: 2rem 1rem;
}
.search-header h1 {
  font-size: 1.8rem;
  margin-bottom: 1rem;
}
.search-input-wrapper {
  margin-bottom: 1.5rem;
}
#searchInput {
  width: 100%;
  padding: 12px 16px;
  font-size: 1rem;
  border: 1px solid var(--border-color, #e5e7eb);
  border-radius: 8px;
  outline: none;
  box-sizing: border-box;
}
#searchInput:focus {
  border-color: #2563eb;
}

/* 태그 나열 부분 수정 스타일 */
.search-tags-section {
  margin-bottom: 2rem;
}
.tags-header {
  display: flex;
  justify-content: space-between;
  align-align: center;
  margin-bottom: 0.75rem;
}
.tags-title {
  font-size: 0.9rem;
  font-weight: 600;
  color: #4b5563;
}
.more-link {
  font-size: 0.85rem;
  color: #2563eb;
  text-decoration: none;
  font-weight: 600;
}
.more-link:hover {
  text-decoration: underline;
}
.tags-wrapper {
  display: flex;
  gap: 0.5rem;
  flex-wrap: wrap;
}
.search-tag-item {
  font-size: 0.82rem;
  background: var(--bg-tag, #f3f4f6);
  color: var(--text-tag, #374151);
  padding: 4px 10px;
  border-radius: 6px;
  text-decoration: none;
}
.search-tag-item:hover {
  background: #e5e7eb;
}

/* 기존 검색 결과 스타일 */
.search-results {
  display: flex;
  flex-direction: column;
  gap: 1.25rem;
}
.search-result-item {
  padding-bottom: 1rem;
  border-bottom: 1px solid var(--border-color, #e5e7eb);
}
.result-date {
  font-size: 0.8rem;
  color: #6b7280;
}
.result-title {
  margin: 0.25rem 0;
  font-size: 1.15rem;
}
.result-title a {
  color: var(--text-color, #111827);
  text-decoration: none;
}
.result-title a:hover {
  color: #2563eb;
}
.result-excerpt {
  font-size: 0.9rem;
  color: #4b5563;
  margin: 0;
}
.no-results {
  color: #6b7280;
  text-align: center;
  padding: 2rem 0;
}
</style>
