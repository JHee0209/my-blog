<div class="card cal-card">

  <div class="cal-nav">
    <button type="button" id="calPrev" aria-label="이전 달">&lsaquo;</button>
    <button type="button" class="cal-today" id="calToday">오늘</button>
    <span class="cal-month" id="calMonth"></span>
    <button type="button" id="calNext" aria-label="다음 달">&rsaquo;</button>
  </div>

  <div class="cal-weekdays" aria-hidden="true">
    <span>일</span><span>월</span><span>화</span><span>수</span>
    <span>목</span><span>금</span><span>토</span>
  </div>

  <div class="cal-grid" id="calGrid"></div>

  <div class="cal-day-panel" id="calPanel">
    <div class="cal-panel-date" id="calDate"></div>
    <div class="cal-panel-list" id="calList"></div>
  </div>

</div>

<script>
(function () {
  var BY_DATE = {
    {% assign grouped = site.posts | group_by_exp: "p", "p.date | date: '%Y-%m-%d'" %}
    {% for g in grouped %}
    "{{ g.name }}": [
      {% for p in g.items %}
      { title: {{ p.title | jsonify }}, url: {{ p.url | relative_url | jsonify }} }{% unless forloop.last %},{% endunless %}
      {% endfor %}
    ]{% unless forloop.last %},{% endunless %}
    {% endfor %}
  };

  var grid = document.getElementById('calGrid');
  var monthLabel = document.getElementById('calMonth');
  var dateLabel = document.getElementById('calDate');
  var list = document.getElementById('calList');
  if (!grid) return;

  function pad(n) { return n < 10 ? '0' + n : '' + n; }
  function keyOf(y, m, d) { return y + '-' + pad(m + 1) + '-' + pad(d); }

  // 항상 오늘 날짜에서 시작한다
  var now = new Date();
  var today = keyOf(now.getFullYear(), now.getMonth(), now.getDate());

  var selected = today;
  var view = new Date(now.getFullYear(), now.getMonth(), 1);

  function renderPanel() {
    list.innerHTML = '';
    if (!selected) { dateLabel.textContent = ''; return; }

    dateLabel.textContent = selected.replace(/-/g, '.');
    var posts = BY_DATE[selected];

    if (!posts || !posts.length) {
      var none = document.createElement('span');
      none.className = 'cal-none';
      none.textContent = '이날은 기록이 없습니다.';
      list.appendChild(none);
      return;
    }

    posts.forEach(function (p) {
      var a = document.createElement('a');
      a.className = 'cal-post';
      a.href = p.url;
      a.textContent = p.title;
      list.appendChild(a);
    });
  }

  function renderGrid() {
    var y = view.getFullYear(), m = view.getMonth();
    monthLabel.textContent = y + '. ' + pad(m + 1);
    grid.innerHTML = '';

    var onThisMonth = (y === now.getFullYear() && m === now.getMonth() && selected === today);
    document.getElementById('calToday').style.visibility = onThisMonth ? 'hidden' : 'visible';

    var offset = new Date(y, m, 1).getDay();
    var total = new Date(y, m + 1, 0).getDate();

    for (var i = 0; i < offset; i++) {
      grid.appendChild(document.createElement('div'));
    }

    for (var d = 1; d <= total; d++) {
      (function (d) {
        var k = keyOf(y, m, d);
        var cell = document.createElement('div');
        cell.className = 'cal-day';
        if (BY_DATE[k]) cell.classList.add('has-post');
        if (k === today) cell.classList.add('is-today');
        if (k === selected) cell.classList.add('is-selected');

        var num = document.createElement('span');
        num.className = 'cal-num';
        num.textContent = d;

        var dot = document.createElement('span');
        dot.className = 'cal-dot';

        cell.appendChild(num);
        cell.appendChild(dot);
        cell.addEventListener('click', function () {
          selected = k;
          renderGrid();
          renderPanel();
        });

        grid.appendChild(cell);
      })(d);
    }
  }

  document.getElementById('calToday').addEventListener('click', function () {
    selected = today;
    view = new Date(now.getFullYear(), now.getMonth(), 1);
    renderGrid();
    renderPanel();
  });

  document.getElementById('calPrev').addEventListener('click', function () {
    view = new Date(view.getFullYear(), view.getMonth() - 1, 1);
    renderGrid();
  });

  document.getElementById('calNext').addEventListener('click', function () {
    view = new Date(view.getFullYear(), view.getMonth() + 1, 1);
    renderGrid();
  });

  renderGrid();
  renderPanel();
})();
</script>
