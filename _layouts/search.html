---
layout: default
---

<style>
.search-wrap { max-width: 1100px; margin: 4rem auto; padding: 0 1.5rem; }

.search-head { text-align: center; margin-bottom: 2rem; }
.search-head h1 { font-size: 2rem; font-weight: 700; margin: 0 0 1.5rem; }

.search-field {
  display: flex; align-items: center; gap: 0.6rem;
  background: #f6f6f9; border: 1px solid #e6e6ef; border-radius: 999px;
  padding: 0.9rem 1.5rem; max-width: 520px; margin: 0 auto 1.5rem;
  transition: background 0.2s, border-color 0.2s, box-shadow 0.2s;
}
.search-field:focus-within {
  background: #fff;
  border-color: #4a3aff;
  box-shadow: 0 0 0 3px rgba(74,58,255,0.12);
}
.search-field input {
  flex: 1; min-width: 0; border: none; outline: none; background: transparent;
  font-size: 1rem; font-family: inherit; color: #222;
}
.search-field input::placeholder { color: #9a9aa8; }
.search-field .icon { flex: none; width: 20px; height: 20px; color: #9a9aa8; }

/* =========================================================
   자주 찾는 태그 영역 (기본 2줄 제한 + More 슬라이드 토글)
   ========================================================= */
.tag-recommend-wrap {
  max-width: 520px;
  margin: 0 auto 2.5rem;
  text-align: left;
}

.tag-recommend-head {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 0.6rem;
}

.tag-recommend-title {
  font-size: 0.82rem;
  font-weight: 700;
  color: #7b7788;
}

.more-btn {
  background: none;
  border: none;
  color: #4a3aff;
  font-size: 0.8rem;
  font-weight: 600;
  cursor: pointer;
  padding: 0;
}
.more-btn:hover { text-decoration: underline; }

/* 기본적으로 2줄 높이만 슬라이드로 보여주기 위한 세팅 */
.tag-list-box {
  display: flex;
  flex-wrap: wrap;
  gap: 0.4rem;
  max-height: 72px; /* 2줄 높이 제한 */
  overflow: hidden;
  transition: max-height 0.35s ease-in-out; /* 슬라이드 애니메이션 */
}

/* More 클릭 시 슬라이드로 펼쳐짐 */
.tag-list-box.is-expanded {
  max-height: 1000px;
}

.rec-tag {
  display: inline-block;
  padding: 0.3rem 0.75rem;
  border-radius: 999px;
  background: #f0eeff;
  color: #4a3aff;
  font-size: 0.78rem;
  font-weight: 600;
  text-decoration: none;
  transition: background 0.18s, color 0.18s, transform 0.18s;
}
.rec-tag:hover {
  background: #4a3aff;
  color: #fff;
  transform: translateY(-2px);
}

/* =========================================================
   검색 결과 카운트 & 카드
   ========================================================= */
.count { text-align: center; color: #aaa; font-size: 0.9rem; margin-bottom: 2.5rem; }
.count strong { color: #4a3aff; }

.results {
  display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
  gap: 1.5rem;
}

.card {
  padding: 1.5rem; border: 1px solid #eee; border-radius: 10px;
  text-decoration: none; color: #333; transition: all 0.2s;
  display: flex; flex-direction: column;
}
.card:hover {
  box-shadow: 0 6px 18px rgba(0,0,0,0.07);
  transform: translateY(-3px); border-color: #4a3aff;
}
.card .meta { font-size: 0.78rem; color: #aaa; margin-bottom: 0.6rem; }
.card .cat {
  background: #f0eeff; color: #4a3aff; padding: 0.15rem 0.5rem;
  border-radius: 4px; font-weight: 600; margin-left: 0.4rem;
}
.card h3 { font-size: 1.05rem; font-weight: 600; margin: 0 0 0.6rem; line-height: 1.45; }
.card .excerpt { font-size: 0.85rem; color: #777; line-height: 1.6; flex-grow: 1; }
.card .tags { display: flex; flex-wrap: wrap; gap: 0.35rem; margin-top: 1rem; }
.card .tags span {
  font-size: 0.7rem; background: #f5f5f5; color: #888;
  padding: 0.2rem 0.55rem; border-radius: 999px;
}

.empty { text-align: center; padding: 4rem 1rem; color: #bbb; }
.empty .empty-icon {
  display: block; width: 56px; height: 56px;
  margin: 0 auto 1rem; color: #d5d5e0;
}
.empty p { margin: 0; font-size: 0.95rem; color: #9a9aa8; }

@media (max-width: 600px) {
  .results { grid-template-columns: 1fr; }
}
</style>

<div class="search-wrap">
  <div class="search-head">
    <h1>Search</h1>
    
    <!-- 검색창 -->
    <div class="search-field">
      <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
           stroke-linecap="round" aria-hidden="true">
        <circle cx="11" cy="11" r="7"></circle>
        <line x1="16.5" y1="16.5" x2="21" y2="21"></line>
      </svg>
      <input type="text" id="q" placeholder="제목이나 태그로 검색" autocomplete="off" aria-label="글 검색">
    </div>

    <!-- 자주 찾는 태그 목록 -->
    {% assign all_tags = site.tags | sort %}
    {% if all_tags.size > 0 %}
    <div class="tag-recommend-wrap">
      <div class="tag-recommend-head">
        <span class="tag-recommend-title">🏷️ 자주 찾는 태그</span>
        <!-- More + 클릭 시 슬라이드로 전체 태그 펼침 -->
        <button type="button" id="toggleTagsBtn" class="more-btn">More +</button>
      </div>
      <div class="tag-list-box" id="tagListBox">
        {% for tag in all_tags %}
          <!-- 태그 클릭 시 전체 태그 페이지(/tags/#태그명)로 이동 -->
          <a href="{{ '/tags/' | relative_url }}#{{ tag[0] | slugify }}" class="rec-tag">#{{ tag[0] }}</a>
        {% endfor %}
      </div>
    </div>
    {% endif %}
  </div>

  <div class="count" id="count"></div>
  <div class="results" id="results"></div>
  <div class="empty" id="empty" style="display:none">
    <svg class="empty-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4"
         stroke-linecap="round" aria-hidden="true">
      <circle cx="11" cy="11" r="7"></circle>
      <line x1="16.5" y1="16.5" x2="21" y2="21"></line>
    </svg>
    <p>일치하는 글이 없습니다.</p>
  </div>
</div>

<script>
var POSTS = [
{% for post in site.posts %}
  {
    title: {{ post.title | jsonify }},
    url: {{ post.url | relative_url | jsonify }},
    date: {{ post.date | date: "%Y.%m.%d" | jsonify }},
    cat: {{ post.categories.first | default: "" | jsonify }},
    excerpt: {{ post.content | strip_html | strip_newlines | truncate: 90 | jsonify }},
    tags: {{ post.tags | jsonify }}
  }{% unless forloop.last %},{% endunless %}
{% endfor %}
];

var input = document.getElementById('q');
var results = document.getElementById('results');
var empty = document.getElementById('empty');
var count = document.getElementById('count');
var tagListBox = document.getElementById('tagListBox');
var toggleTagsBtn = document.getElementById('toggleTagsBtn');

/* More 버튼 클릭 시 슬라이드 토글 동작 */
if (toggleTagsBtn && tagListBox) {
  toggleTagsBtn.addEventListener('click', function () {
    if (tagListBox.classList.contains('is-expanded')) {
      tagListBox.classList.remove('is-expanded');
      toggleTagsBtn.textContent = 'More +';
    } else {
      tagListBox.classList.add('is-expanded');
      toggleTagsBtn.textContent = 'Fold -';
    }
  });
}

function esc(s) {
  return String(s).replace(/[&<>"]/g, function (c) {
    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c];
  });
}

function render(list, query) {
  results.innerHTML = '';

  if (!query) {
    count.textContent = '';
    empty.style.display = 'none';
    return;
  }

  count.innerHTML = '<strong>' + list.length + '</strong>개의 글';

  if (list.length === 0) {
    empty.style.display = 'block';
    return;
  }
  empty.style.display = 'none';

  list.forEach(function (p) {
    var a = document.createElement('a');
    a.href = p.url;
    a.className = 'card';

    var catHtml = p.cat ? '<span class="cat">' + esc(p.cat) + '</span>' : '';
    var tagHtml = '';
    if (p.tags && p.tags.length) {
      tagHtml = '<div class="tags">' + p.tags.map(function (t) {
        return '<span>' + esc(t) + '</span>';
      }).join('') + '</div>';
    }

    a.innerHTML =
      '<div class="meta">' + esc(p.date) + catHtml + '</div>' +
      '<h3>' + esc(p.title) + '</h3>' +
      '<div class="excerpt">' + esc(p.excerpt) + '</div>' +
      tagHtml;

    results.appendChild(a);
  });
}

function search(query) {
  var q = (query || '').trim().toLowerCase();
  if (!q) { render([], ''); return; }

  var hits = POSTS.filter(function (p) {
    var inTitle = p.title.toLowerCase().indexOf(q) !== -1;
    var inTags = (p.tags || []).join(' ').toLowerCase().indexOf(q) !== -1;
    var inBody = p.excerpt.toLowerCase().indexOf(q) !== -1;
    return inTitle || inTags || inBody;
  });

  render(hits, q);
}

// URL의 ?q= 값으로 초기 검색
var params = new URLSearchParams(window.location.search);
var initial = params.get('q') || params.get('tag') || '';
if (initial) {
  input.value = initial;
  search(initial);
}

input.addEventListener('input', function (e) { search(e.target.value); });
input.focus();
</script>
