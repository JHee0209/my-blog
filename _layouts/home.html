---
layout: default
---

<style>
  /* 불필요한 기본 테마 햄버거 아이콘 강제 숨김 처리 */
  .sidebar-toggle-wrapper {
    display: none !important;
  }

/* ===== 홈 페이지 스타일 ===== */
.home-wrap {
  max-width: 1100px;
  margin: 0 auto;
  padding: 0 1.5rem 6rem;
  text-align: left !important;
}

.hero {
  text-align: center;
  padding: 4.5rem 1rem;
}
.hero h1 {
  font-size: 3rem;
  font-weight: 700;
  margin: 0 0 1rem;
  letter-spacing: -0.02em;
}
.hero p {
  font-size: 1rem;
  color: #666;
  margin: 0;
  line-height: 1.7;
}

.home-divider {
  height: 1px;
  background: #f0f0f4;
  margin: 3.5rem 0 3rem;
  border: 0;
}

@media (max-width: 600px) {
  .hero { padding: 3rem 1rem; }
  .hero h1 { font-size: 2.2rem; }
  .home-divider { margin: 2.8rem 0 2.4rem; }
}
</style>

<div class="hero">
  <h1>{{ page.title }}</h1>
  <p>{{ content }}</p>
</div>

<div class="home-wrap">
  {% include calendar.html %}

  <hr class="home-divider">

  {% include timeline.html limit=3 more=true %}
</div>
